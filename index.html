<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naam Toon Studio</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">◈</span> Naam Toon <small>STUDIO</small></div>
  <input id="project-name" aria-label="Project name">
  <div class="top-actions">
    <button id="new-project">New project</button>
    <button data-pick="restore">Open project</button><input id="restore" type="file" accept=".json" hidden>
    <button id="save-project">Save project</button>
    <button id="render" class="primary">Render MP4</button>
  </div>
</header>
<nav id="categories" aria-label="Production categories">
  <button data-category="sources">Source overview</button>
  <button data-category="script">Script &amp; media</button>
  <button data-category="clips">Clip assembly</button>
  <button data-category="presenter">Presenter</button>
  <button data-category="animation">Animation</button>
</nav>
<main>
  <section class="card inputs" aria-labelledby="input-heading">
    <div class="bar"><h2 id="input-heading">Source overview</h2></div>
    <div class="pad stack">
      <div id="source-tools" class="stack">
        <label>Source title <input id="source-name" placeholder="Production notes"></label>
        <label>Source text <textarea id="source-text" rows="4" placeholder="Paste reference material"></textarea></label>
        <div class="row">
          <button id="add-source">Add source</button>
          <button data-pick="source-files">Import TXT / MD</button><input id="source-files" type="file" accept=".txt,.md" multiple hidden>
        </div>
        <div id="sources" class="stack source-list"></div>
      </div>
      <label id="brief-label">Script or brief <textarea id="brief" rows="6"></textarea></label>
      <label>Planning engine <select id="model"></select></label>
      <span class="muted" id="model-help"></span>
      <div class="row settings">
        <label>Format <select id="format"><option value="short">Short</option><option value="explainer" selected>Explainer</option><option value="detailed">Detailed</option></select></label>
        <label>Draft language <select id="language"><option>Source language</option><option>English</option><option>Punjabi (Gurmukhi)</option></select></label>
      </div>
      <label id="focus-label">Focus or revision notes <textarea id="focus" rows="2" placeholder="What should the audience take away?"></textarea></label>
      <button id="draft" class="primary">Draft scenes</button>
      <div id="draft-review" class="stack" hidden>
        <h3>Review draft</h3><ol id="draft-scenes"></ol>
        <div class="row"><button id="apply-draft">Append</button><button id="replace-draft">Replace storyboard</button><button id="discard-draft">Discard</button></div>
      </div>
      <div class="divider"></div>
      <h3>Media library</h3>
      <button data-pick="media-files">Import images, clips or audio</button>
      <input id="media-files" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm,video/quicktime,audio/wav,audio/mpeg,audio/mp4,audio/ogg,audio/webm" multiple hidden>
      <span class="muted" id="media-list"></span>
    </div>
  </section>
  <section class="card work" aria-labelledby="monitor-heading">
    <div class="bar"><h2 id="monitor-heading">Scene monitor</h2><span id="monitor-kind" class="muted">Storyboard preview</span></div>
    <div class="pad stack">
      <div id="stage" class="stage">
        <img id="background-view" alt="" hidden>
        <video id="footage-view" muted playsinline hidden></video>
        <img id="actor-view" alt="" hidden>
        <div id="caption-view"><strong id="stage-title"></strong><span id="stage-text"></span></div>
      </div>
      <video id="result" controls playsinline hidden></video>
      <div class="row transport">
        <button id="play">Play storyboard</button>
        <input id="seek" type="range" min="0" step=".05" value="0" aria-label="Storyboard position">
        <output id="time"></output>
      </div>
      <div class="row">
        <button id="show-storyboard" hidden>Back to storyboard</button>
        <a id="download" class="button" download="naam-toon.mp4" hidden>Download MP4</a>
      </div>
      <div class="divider"></div>
      <div class="row between"><h2>Storyboard</h2><div class="row"><button id="undo" disabled>Undo storyboard change</button><button id="add-scene">+ Scene</button></div></div>
      <div id="timeline" aria-label="Scene order"></div>
      <p id="status" role="status" class="status"></p>
    </div>
  </section>
  <section class="card inspector" aria-labelledby="scene-heading">
    <div class="bar"><h2 id="scene-heading">Scene inspector</h2><span id="scene-number" class="muted"></span></div>
    <div class="pad stack">
      <label>Title <input id="scene-title" maxlength="140"></label>
      <label>Narration / caption <textarea id="scene-script" rows="4" maxlength="1500"></textarea></label>
      <label>Source link <select id="reference"></select></label>
      <blockquote id="quote" hidden></blockquote>
      <div class="row settings">
        <label>Seconds <input id="duration" type="number" min="1" max="120" step="1"></label>
        <label>Transition <select id="transition"><option value="cut">Cut</option><option value="fade">Fade through black</option></select></label>
      </div>
      <label>Background <select id="background"></select></label>
      <label>Video clip <select id="footage"></select></label>
      <details id="generate-clip">
        <summary>Generate moving video</summary>
        <div class="stack clip-settings">
          <label>Video model <select id="video-model"></select></label>
          <p id="video-model-help" class="muted"></p>
          <button id="check-video-models">Refresh video models</button>
          <label>Motion prompt <textarea id="video-prompt" rows="3" maxlength="2000" placeholder="Describe the subject, scene and movement"></textarea></label>
          <div class="row settings">
            <label>Frame shape <select id="video-shape"><option value="landscape">Landscape</option><option value="portrait">Portrait</option><option value="square">Square</option></select></label>
            <label>Generated frames <select id="video-frames"><option>17</option><option selected>33</option><option>49</option></select></label>
          </div>
          <label>Seed <input id="video-seed" type="number" min="0" max="4294967295" placeholder="Random"></label>
          <button id="queue-video" class="primary" disabled>Generate scene clip</button>
          <p id="video-status" role="status" class="muted"></p>
          <div id="video-history" class="stack" aria-label="Generated clips for this scene"></div>
        </div>
      </details>
      <label>Presenter portrait <select id="actor"></select></label>
      <label>Scene audio <select id="audio"></select></label>
      <label>Still-image motion <select id="motion"><option value="still">Static</option><option value="push">Slow push-in</option></select></label>
      <div class="row"><button id="earlier">Move left</button><button id="later">Move right</button><button id="duplicate">Duplicate</button><button id="remove">Remove</button></div>
      <div class="divider"></div>
      <h3>Output settings</h3>
      <label>Frame <select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></label>
      <label>Voice <select id="voice"></select></label>
      <label class="check"><input type="checkbox" id="captions"> Burn in scene captions</label>
    </div>
  </section>
</main>
</body>
</html>
