name: Native render smoke
on:
  push:
    branches: [studio-v2]
  pull_request:
    branches: [studio-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: Render on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Install FriBiDi on macOS
        if: runner.os == 'macOS'
        run: brew list fribidi >/dev/null 2>&1 || brew install fribidi
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-fribidi
      - name: Expose FriBiDi on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Run packaged launcher smoke check
        if: runner.os != 'Windows'
        run: ./launch.sh --smoke
      - name: Run packaged launcher smoke check
        if: runner.os == 'Windows'
        shell: cmd
        run: launch.cmd --smoke
