name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps (ffmpeg)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg libsm6 libxext6

      - name: Check requirements file
        run: |
          if [ ! -f requirements.txt ]; then
            echo "requirements.txt not found in repository root"
            ls -la
            exit 1
          fi

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run builder (dry-run, CI-safe)
        run: |
          python colab/master_builder.py --dry-run --no-tts
